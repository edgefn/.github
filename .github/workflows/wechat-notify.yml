name: Wechat Notify

on:
  workflow_call:
    inputs:
      # —— 保留 env 块实际引用的 inputs ——
      environment_name:
        description: "GitHub environment used to resolve notification settings."
        required: true
        type: string
      repo:
        description: "仓库标识（如 edgefn/next-router-meta）"
        required: true
        type: string
      # —— 新增 env 块 L94-107 所需的 inputs ——
      notify_type:
        description: "通知类型: deploy / deploy_result / build / merge"
        required: true
        type: string
        default: "deploy_result"
      platform:
        description: "部署平台（如 Aliyun SAE）"
        required: false
        type: string
        default: ""
      service_name:
        description: "服务名称"
        required: false
        type: string
        default: ""
      region:
        description: "部署区域"
        required: false
        type: string
        default: ""
      sha:
        description: "提交 SHA"
        required: false
        type: string
        default: ""
      release_tag:
        description: "发布标签"
        required: false
        type: string
        default: ""
      actor:
        description: "触发操作的用户"
        required: false
        type: string
        default: ""
      run_url:
        description: "工作流运行链接"
        required: false
        type: string
        default: ""
      build_status:
        description: "构建状态: success / failure / cancelled"
        required: false
        type: string
        default: ""
      deploy_status:
        description: "部署状态: success / failure / cancelled"
        required: false
        type: string
        default: ""
      run_status:
        description: "工作流运行状态"
        required: false
        type: string
        default: ""
      # —— PR merge 通知专用 inputs（NOTIFY_TYPE=merge 时生效）——
      pr_author:
        description: "PR 作者"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支"
        required: false
        type: string
        default: ""
      head_ref:
        description: "PR 来源分支"
        required: false
        type: string
        default: ""
      # —— dry_run 控制（bash 脚本 --dry 参数需要）——
      dry_run:
        description: "Print notification content without sending it."
        required: false
        type: boolean
        default: false
    secrets:
      wechat_webhook_key:
        description: "WeChat Work Webhook Key (alternative pass-through)"
        required: false
  workflow_dispatch:
    inputs:
      environment_name:
        description: "GitHub environment used to resolve notification settings."
        required: false
        type: string
        default: test
      repo:
        required: false
        type: string
        default: edgefn/next-router-meta
      notify_type:
        description: "通知类型: deploy / deploy_result / build / merge"
        required: true
        type: string
        default: "deploy_result"
      platform:
        required: false
        type: string
        default: ""
      service_name:
        required: false
        type: string
        default: ""
      region:
        required: false
        type: string
        default: ""
      sha:
        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""
      actor:
        required: false
        type: string
        default: ""
      run_url:
        required: false
        type: string
        default: ""
      build_status:
        required: false
        type: string
        default: ""
      deploy_status:
        required: false
        type: string
        default: ""
      run_status:
        required: false
        type: string
        default: ""
      pr_author:
        description: "PR 作者（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接（merge 通知用）"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支（merge 通知用）"
        required: false
        type: string
        default: ""
      head_ref:
        description: "PR 来源分支（merge 通知用）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print notification content without sending it."
        required: false
        type: boolean
        default: true
      wechat_webhook_key:
        description: "WeChat Work Webhook Key"
        required: false
        type: string
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Send WeChat Work webhook message
        uses: actions/github-script@v7
        env:
          WECHAT_WEBHOOK_KEY: ${{ secrets.wechat_webhook_key || inputs.wechat_webhook_key }}
          NOTIFY_TYPE: ${{ inputs.notify_type }}
          PLATFORM: ${{ inputs.platform }}
          SERVICE_NAME: ${{ inputs.service_name }}
          ENV_NAME: ${{ inputs.environment_name }}
          REGION: ${{ inputs.region }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACTOR: ${{ inputs.actor }}
          RUN_URL: ${{ inputs.run_url }}
          BUILD_STATUS: ${{ inputs.build_status }}
          DEPLOY_STATUS: ${{ inputs.deploy_status }}
          RUN_STATUS: ${{ inputs.run_status }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        with:
          script: |
            const e = process.env;

            // ---------- 常量 ----------
            const ECS_PREFIXES = ['r9s-dev-', 'r9s-stag-', 'r9s-prod-'];
            const STATUS_LABELS = { success: '成功', failure: '失败', cancelled: '已取消' };
            const MAX_RETRIES = 3;
            const RETRY_BACKOFF = 1000; // ms

            // ---------- 辅助函数 ----------
            const get = (k, d = '') => e[k] ?? d;
            const displaySvc = (n) => ECS_PREFIXES.some(p => n.startsWith(p)) ? n.slice(ECS_PREFIXES.find(p => n.startsWith(p)).length) : n;
            const repo = () => get('REPO', get('GITHUB_REPOSITORY'));
            const sha7 = () => (get('SHA', get('GITHUB_SHA')) || '').slice(0, 7);
            const actor = () => get('ACTOR', get('GITHUB_ACTOR'));
            const label = (s, d = '未完成') => STATUS_LABELS[s] || d;
            const withUrl = (c) => get('RUN_URL') ? c + `**详情**：[查看工作流](${get('RUN_URL')})\n` : c;
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            // ---------- 四种 markdown 构建 ----------
            const builders = {
              deploy_result: () => {
                const svc = displaySvc(get('SERVICE_NAME'));
                const bs = get('BUILD_STATUS'), ds = get('DEPLOY_STATUS');
                const status = bs === 'success' ? ds : bs;
                const icon = status === 'success' ? '✅' : '❌';
                const shaFull = get('SHA', get('GITHUB_SHA'));
                return withUrl(
                  `### ${icon} ${get('PLATFORM')} ${svc} 部署${label(status)}\n` +
                  `**环境**：${get('ENV_NAME')}\n` +
                  `**区域**：${get('REGION')}\n` +
                  `**仓库**：${repo()}\n` +
                  `**版本**：${get('RELEASE_TAG')} (${shaFull.slice(0, 7)})\n` +
                  `**操作人**：${actor()}\n` +
                  `**构建状态**：${bs}\n` +
                  `**部署状态**：${ds}\n`
                );
              },
              deploy: () => {
                const svc = displaySvc(get('SERVICE_NAME'));
                return withUrl(
                  `### 🚀 ${svc} 部署任务已提交\n` +
                  `**环境**：${get('ENV_NAME', 'test')}\n` +
                  `**区域**：${get('REGION')}\n` +
                  `**仓库**：${repo()}\n` +
                  `**版本**：${sha7()}\n` +
                  `**操作人**：${actor()}\n` +
                  `**提交状态**：${get('DEPLOY_STATUS')}\n`
                );
              },
              build: () => {
                const svc = displaySvc(get('SERVICE_NAME'));
                const ds = get('DEPLOY_STATUS');
                const icon = ds === 'success' ? '✅' : '❌';
                return withUrl(
                  `### ${icon} ${svc} 构建${label(ds, ds || '未知')}\n` +
                  `**环境**：${get('ENV_NAME', 'test')}\n` +
                  `**区域**：${get('REGION')}\n` +
                  `**仓库**：${repo()}\n` +
                  `**版本**：${sha7()}\n` +
                  `**操作人**：${actor()}\n` +
                  `**构建状态**：${label(ds, ds || '未知')}\n`
                );
              },
              merge: () => {
                const prAuthor = get('PR_AUTHOR');
                const prNumber = get('PR_NUMBER') || (get('PR_URL') ? get('PR_URL').replace(/\/$/, '').split('/').pop() : '');
                const prTitle = get('PR_TITLE');
                const prUrl = get('PR_URL');
                const headRef = get('HEAD_REF');
                const baseRef = get('BASE_REF');
                const titleLine = (prNumber && prUrl) ? `### ✅ PR [${prNumber}](${prUrl}) 已合并` : '### ✅ PR 已合并';
                return withUrl(
                  `${titleLine}\n` +
                  `**仓库**：${repo()}\n` +
                  `**提交人**：${prAuthor}\n` +
                  `**分支**：${headRef} → ${baseRef}\n` +
                  `**标题**：${prTitle}\n`
                );
              },
            };

            // ---------- 主流程 ----------
            const webhookKey = get('WECHAT_WEBHOOK_KEY');
            if (!webhookKey) {
              core.warning('Missing WECHAT_WEBHOOK_KEY; deployment notification not sent.');
              return;
            }

            const notifyType = get('NOTIFY_TYPE', 'merge');
            const content = (builders[notifyType] || builders.merge)();

            // dry_run 通过 context.inputs 读取
            if (context.inputs?.dry_run === true || context.inputs?.dry_run === 'true') {
              core.info('[dry_run] generated markdown:\n' + content);
              return;
            }

            // ---------- 发送（带重试） ----------
            const url = `https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${webhookKey}`;
            const payload = JSON.stringify({ msgtype: 'markdown', markdown: { content } });
            let lastErr;

            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              try {
                const resp = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json; charset=utf-8' },
                  body: payload,
                });
                const body = await resp.text();
                if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${body}`);
                const result = JSON.parse(body);
                if (result.errcode !== 0) throw new Error(`WeChat Work error: ${body}`);
                core.info('WeChat Work notification sent successfully.');
                return;
              } catch (err) {
                lastErr = err;
                core.warning(`Attempt ${attempt}/${MAX_RETRIES} failed: ${err.message}`);
                if (attempt < MAX_RETRIES) await sleep(RETRY_BACKOFF * Math.pow(2, attempt - 1));
              }
            }
            throw lastErr;
