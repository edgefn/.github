name: WeChat Work Notify test

on:
  workflow_dispatch:

jobs:
  notify-test:
    name: Discord Notify test
    uses: edgefn/.github/.github/workflows/discord-notify.yml@main
    with:
      environment_name: prod
      repo: edgefn/next-router-meta
      notify_type: merge
      pr_author: dotwoo
      pr_number: 123456
      pr_title: "Merge branch 'main' into 'next-router-meta'"
      pr_url: https://github.com/edgefn/next-router-meta/pull/123456
      base_ref: main
      head_ref: next-router-meta
      run_url: ${{ github.event.workflow_run.html_url }}
      dry_run: false
