        required: true
        type: string
        default: "deploy_result"
      platform:
        description: "部署平台（如 Aliyun SAE）"
        required: false
        type: string
        default: ""
      service_name:
        description: "服务名称"
        required: false
        type: string
        default: ""
      region:
        description: "部署区域"
        required: false
        type: string
        default: ""
      sha:
        description: "提交 SHA"
        required: false
        type: string
        default: ""
      release_tag:
        description: "发布标签"
        required: false
        type: string
        default: ""
      actor:
        description: "触发操作的用户"
        required: false
        type: string
        default: ""
      run_url:
        description: "工作流运行链接"
        required: false
        type: string
        default: ""
      build_status:
        description: "构建状态: success / failure / cancelled"
        required: false
        type: string
        default: ""
      deploy_status:
        description: "部署状态: success / failure / cancelled"
        required: false
        type: string
        default: ""
      run_status:
        description: "工作流运行状态"
        required: false
        type: string
        default: ""
      # —— PR merge 通知专用 inputs（NOTIFY_TYPE=merge 时生效）——
      pr_author:
        description: "PR 作者"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支"
        required: false
        type: string
        default: ""
      head_ref:
