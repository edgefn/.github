name: Slack Notify

on:
  workflow_call:
    inputs:
      # —— 保留 env 块实际引用的 inputs ——
      environment_name:
        description: "GitHub environment used to resolve notification settings."
        required: true
        type: string
      repo:
        description: "仓库标识（如 edgefn/next-router-meta）"
        required: true
        type: string
      # —— 新增 env 块 L94-107 所需的 inputs ——
      notify_type:
        description: "通知类型: deploy / deploy_result / build / merge / branch_cleanup"
        required: true
        type: string
        default: "deploy_result"
      platform:
        description: "部署平台（如 Aliyun SAE）"
        required: false
        type: string
        default: ""
      service_name:
        description: "服务名称"
        required: false
        type: string
        default: ""
      region:
        description: "部署区域"
        required: false
        type: string
        default: ""
      sha:
        description: "提交 SHA"
        required: false
        type: string
        default: ""
      release_tag:
        description: "发布标签"
        required: false
        type: string
        default: ""
      actor:
        description: "触发操作的用户"
        required: false
        type: string
        default: ""
      run_url:
        description: "工作流运行链接"
        required: false
        type: string
        default: ""
      build_status:
        description: "构建状态: success / failure / cancelled"
        required: false
        type: string
        default: ""
      deploy_status:
        description: "部署状态: success / failure / cancelled"
        required: false
        type: string
        default: ""
      run_status:
        description: "工作流运行状态"
        required: false
        type: string
        default: ""
      # —— PR merge 通知专用 inputs（NOTIFY_TYPE=merge 时生效）——
      pr_author:
        description: "PR 作者"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支"
        required: false
        type: string
        default: ""
      head_ref:
        description: "PR 来源分支"
        required: false
        type: string
        default: ""
      # —— dry_run 控制（bash 脚本 --dry 参数需要）——
      # —— 已合并分支清理通知专用 inputs ——
      default_branch:
        description: "默认分支（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      deleted_count:
        description: "已删除分支数量（branch_cleanup 通知用）"
        required: false
        type: string
        default: "0"
      deleted_branches:
        description: "已删除分支列表，可包含换行（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print notification content without sending it."
        required: false
        type: boolean
        default: false

    secrets:
      SLACK_ALERT_BOT:
        description: "Slack incoming webhook URL."
        required: false

  workflow_dispatch:
    inputs:
      environment_name:
        description: "GitHub environment used to resolve notification settings."
        required: false
        type: string
        default: test
      repo:
        required: false
        type: string
        default: edgefn/next-router-meta
      notify_type:
        description: "通知类型: deploy / deploy_result / build / merge / branch_cleanup"
        required: true
        type: string
        default: "deploy_result"
      platform:
        required: false
        type: string
        default: ""
      service_name:
        required: false
        type: string
        default: ""
      region:
        required: false
        type: string
        default: ""
      sha:
        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""
      actor:
        required: false
        type: string
        default: ""
      run_url:
        required: false
        type: string
        default: ""
      build_status:
        required: false
        type: string
        default: ""
      deploy_status:
        required: false
        type: string
        default: ""
      run_status:
        required: false
        type: string
        default: ""
      pr_author:
        description: "PR 作者（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接（merge 通知用）"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支（merge 通知用）"
        required: false
        type: string
        default: ""
      head_ref:
        description: "PR 来源分支（merge 通知用）"
        required: false
        type: string
        default: ""
      # —— 已合并分支清理通知专用 inputs ——
      default_branch:
        description: "默认分支（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      deleted_count:
        description: "已删除分支数量（branch_cleanup 通知用）"
        required: false
        type: string
        default: "0"
      deleted_branches:
        description: "已删除分支列表，可包含换行（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print notification content without sending it."
        required: false
        type: boolean
        default: true

jobs:
  s-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Send Slack webhook message
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_BOT }}
          DRY_RUN: ${{ inputs.dry_run }}
          NOTIFY_TYPE: ${{ inputs.notify_type }}
          PLATFORM: ${{ inputs.platform }}
          SERVICE_NAME: ${{ inputs.service_name }}
          ENV_NAME: ${{ inputs.environment_name }}
          REGION: ${{ inputs.region }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACTOR: ${{ inputs.actor }}
          RUN_URL: ${{ inputs.run_url }}
          BUILD_STATUS: ${{ inputs.build_status }}
          DEPLOY_STATUS: ${{ inputs.deploy_status }}
          RUN_STATUS: ${{ inputs.run_status }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          DELETED_COUNT: ${{ inputs.deleted_count }}
          DELETED_BRANCHES: ${{ inputs.deleted_branches }}
        with:
          script: |
            const e = process.env;

            // ---------- 常量 ----------
            const ECS_PREFIXES = ['r9s-dev-', 'r9s-stag-', 'r9s-prod-'];
            const STATUS_COLORS = { success: '#57F287', failure: '#ED4245', cancelled: '#99AAB5' };
            const DEFAULT_COLOR = '#ED4245';
            const MAX_RETRIES = 3;
            const RETRY_BACKOFF = 1000; // ms

            // ---------- 辅助函数 ----------
            const get = (k, d = '') => e[k] || d;
            const displaySvc = (n) => ECS_PREFIXES.some(p => n.startsWith(p)) ? n.slice(ECS_PREFIXES.find(p => n.startsWith(p)).length) : n;
            const repo = () => get('REPO', get('GITHUB_REPOSITORY'));
            const sha7 = () => (get('SHA', get('GITHUB_SHA')) || '').slice(0, 7);
            const actor = () => get('ACTOR', get('GITHUB_ACTOR'));
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            // ---------- 五种 markdown 构建（与 wechat-notify 保持一致） ----------
            const builders = {
              deploy_result: () => {
                const svc = displaySvc(get('SERVICE_NAME'));
                const bs = get('BUILD_STATUS'), ds = get('DEPLOY_STATUS');
                const status = bs === 'success' ? ds : bs;
                const icon = status === 'success' ? '✅' : '❌';
                const shaFull = get('SHA', get('GITHUB_SHA'));
                return (
                  `### ${icon} ${get('PLATFORM')} ${svc} 部署${status === 'success' ? '成功' : '失败'}\n` +
                  `**环境**：${get('ENV_NAME')}\n` +
                  `**区域**：${get('REGION')}\n` +
                  `**仓库**：${repo()}\n` +
                  `**版本**：${get('RELEASE_TAG')} (${shaFull.slice(0, 7)})\n` +
                  `**操作人**：${actor()}\n` +
                  `**构建状态**：${bs}\n` +
                  `**部署状态**：${ds}\n`
                );
              },
              deploy: () => {
                const svc = displaySvc(get('SERVICE_NAME'));
                return (
                  `### 🚀 ${svc} 部署任务已提交\n` +
                  `**环境**：${get('ENV_NAME', 'test')}\n` +
                  `**区域**：${get('REGION')}\n` +
                  `**仓库**：${repo()}\n` +
                  `**版本**：${sha7()}\n` +
                  `**操作人**：${actor()}\n` +
                  `**提交状态**：${get('DEPLOY_STATUS')}\n`
                );
              },
              build: () => {
                const svc = displaySvc(get('SERVICE_NAME'));
                const ds = get('DEPLOY_STATUS');
                const icon = ds === 'success' ? '✅' : '❌';
                const label = ds === 'success' ? '成功' : ds === 'failure' ? '失败' : ds || '未知';
                return (
                  `### ${icon} ${svc} 构建${label}\n` +
                  `**环境**：${get('ENV_NAME', 'test')}\n` +
                  `**区域**：${get('REGION')}\n` +
                  `**仓库**：${repo()}\n` +
                  `**版本**：${sha7()}\n` +
                  `**操作人**：${actor()}\n` +
                  `**构建状态**：${label}\n`
                );
              },
              branch_cleanup: () => {
                const defaultBranch = get('DEFAULT_BRANCH');
                const deletedCount = get('DELETED_COUNT') || '0';
                const deletedBranches = get('DELETED_BRANCHES').trim();
                let content = (
                  `### 🧹 已清理已合并分支\n` +
                  `**仓库**：${repo()}\n` +
                  `**默认分支**：${defaultBranch}\n` +
                  `**删除数量**：${deletedCount}\n`
                );
                if (deletedBranches) content += `**已删除分支**：\n${deletedBranches}\n`;
                return content;
              },
              merge: () => {
                const prAuthor = get('PR_AUTHOR');
                const prNumber = get('PR_NUMBER') || (get('PR_URL') ? get('PR_URL').replace(/\/$/, '').split('/').pop() : '');
                const prTitle = get('PR_TITLE');
                const prUrl = get('PR_URL');
                const headRef = get('HEAD_REF');
                const baseRef = get('BASE_REF');
                const titleLine = (prNumber && prUrl) ? `### ✅ PR [${prNumber}](${prUrl}) 已合并` : '### ✅ PR 已合并';
                return (
                  `${titleLine}\n` +
                  `**仓库**：${repo()}\n` +
                  `**提交人**：${prAuthor}\n` +
                  `**分支**：${headRef} → ${baseRef}\n` +
                  `**标题**：${prTitle}\n`
                );
              },
            };

            // Slack mrkdwn uses *bold* and <url|label>, not Discord markdown.
            function slackMarkdown(markdown) {
              return markdown
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\*\*([^\n]+?)\*\*/g, '*$1*')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<$2|$1>');
            }

            function buildPayload(markdown, notifyType) {
              const lines = markdown.trim().split('\n');
              const title = slackMarkdown(lines.shift().replace(/^### /, ''));
              let description = slackMarkdown(lines.join('\n').trim());
              const runUrl = get('RUN_URL');
              if (runUrl) description += `\n*详情*：<${runUrl}|查看工作流>`;

              let status = 'success';
              if (notifyType === 'deploy_result') {
                const bs = get('BUILD_STATUS'), ds = get('DEPLOY_STATUS');
                status = bs === 'success' ? ds : bs;
              } else if (notifyType === 'build') {
                status = get('DEPLOY_STATUS') || 'success';
              }

              return {
                channel: '#alert',
                username: 'webhookbot',
                icon_emoji: ':ghost:',
                text: `*${title}*`,
                attachments: [{
                  color: STATUS_COLORS[status] ?? DEFAULT_COLOR,
                  text: description,
                  mrkdwn_in: ['text'],
                }],
              };
            }

            const notifyType = get('NOTIFY_TYPE', 'merge');
            const payload = buildPayload((builders[notifyType] || builders.merge)(), notifyType);
            if (get('DRY_RUN') === 'true') {
              core.info('[dry_run] generated Slack payload:\n' + JSON.stringify(payload, null, 2));
              return;
            }

            const webhookUrl = get('SLACK_WEBHOOK_URL');
            if (!webhookUrl) {
              core.warning('Missing SLACK_WEBHOOK_URL; notification not sent.');
              return;
            }

            // Equivalent to curl --data-urlencode "payload=...".
            const body = new URLSearchParams({ payload: JSON.stringify(payload) }).toString();
            let lastErr;
            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              try {
                const resp = await fetch(webhookUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body,
                  signal: AbortSignal.timeout(15000),
                });
                const responseBody = await resp.text();
                if (!resp.ok || responseBody.trim() !== 'ok') {
                  throw new Error(`Slack webhook rejected notification (HTTP ${resp.status}).`);
                }
                core.info('Slack notification sent successfully.');
                return;
              } catch (err) {
                // Do not log errors containing the secret webhook URL.
                lastErr = new Error('Slack notification failed after retries.');
                core.warning(`Attempt ${attempt}/${MAX_RETRIES} failed.`);
                if (attempt < MAX_RETRIES) await sleep(RETRY_BACKOFF * Math.pow(2, attempt - 1));
              }
            }
            throw lastErr;
