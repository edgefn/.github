        required: false
        type: string
        default: ""
      # —— dry_run 控制（bash 脚本 --dry 参数需要）——
      # —— 已合并分支清理通知专用 inputs ——
      default_branch:
        description: "默认分支（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      deleted_count:
        description: "已删除分支数量（branch_cleanup 通知用）"
        required: false
        type: string
        default: "0"
      deleted_branches:
        description: "已删除分支列表，可包含换行（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print notification content without sending it."
        required: false
        type: boolean
        default: false

    secrets:
      SLACK_ALERT_BOT:
        description: "Slack incoming webhook URL."
        required: false

  workflow_dispatch:
    inputs:
      environment_name:
        description: "GitHub environment used to resolve notification settings."
        required: false
        type: string
        default: test
      repo:
        required: false
        type: string
        default: edgefn/next-router-meta
      notify_type:
        description: "通知类型: deploy / deploy_result / build / merge / branch_cleanup"
        required: true
        type: string
        default: "deploy_result"
      platform:
        required: false
        type: string
        default: ""
      service_name:
        required: false
        type: string
        default: ""
      region:
        required: false
        type: string
        default: ""
      sha:
        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""
      actor:
        required: false
        type: string
        default: ""
      run_url:
        required: false
        type: string
        default: ""
      build_status:
        required: false
        type: string
        default: ""
      deploy_status:
        required: false
        type: string
        default: ""
      run_status:
        required: false
        type: string
        default: ""
      pr_author:
        description: "PR 作者（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接（merge 通知用）"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支（merge 通知用）"
        required: false
        type: string
        default: ""
      head_ref:
        description: "PR 来源分支（merge 通知用）"
        required: false
        type: string
        default: ""
      # —— 已合并分支清理通知专用 inputs ——
      default_branch:
        description: "默认分支（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      deleted_count:
        description: "已删除分支数量（branch_cleanup 通知用）"
        required: false
        type: string
        default: "0"
      deleted_branches:
        description: "已删除分支列表，可包含换行（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print notification content without sending it."
        required: false
        type: boolean
        default: true

jobs:
  s-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Reusable workflows execute in the caller context; load our trusted formatter.
      - name: Checkout notification scripts
        uses: actions/checkout@v4
        with:
          repository: edgefn/.github
          # Local runs use their commit; cross-repository callers use the shared main branch.
          ref: ${{ github.repository == 'edgefn/.github' && github.sha || 'main' }}
          path: .notification-source
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Send Slack webhook message
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_BOT }}
          DRY_RUN: ${{ inputs.dry_run }}
          NOTIFY_TYPE: ${{ inputs.notify_type }}
          PLATFORM: ${{ inputs.platform }}
          SERVICE_NAME: ${{ inputs.service_name }}
          ENV_NAME: ${{ inputs.environment_name }}
          REGION: ${{ inputs.region }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACTOR: ${{ inputs.actor }}
          RUN_URL: ${{ inputs.run_url }}
          BUILD_STATUS: ${{ inputs.build_status }}
          DEPLOY_STATUS: ${{ inputs.deploy_status }}
          RUN_STATUS: ${{ inputs.run_status }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          DELETED_COUNT: ${{ inputs.deleted_count }}
          DELETED_BRANCHES: ${{ inputs.deleted_branches }}
        with:
          script: |
            const { buildNotification } = require(`${process.env.GITHUB_WORKSPACE}/.notification-source/.github/scripts/notification-format.cjs`);
            const get = (key, fallback = '') => process.env[key] || fallback;
            const MAX_RETRIES = 3;
            const RETRY_BACKOFF = 1000;
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const payload = buildNotification('slack');

            if (get('DRY_RUN') === 'true') {
              core.info('[dry_run] generated Slack payload:\n' + JSON.stringify(payload, null, 2));
              return;
            }

            const webhookUrl = get('SLACK_WEBHOOK_URL');
            if (!webhookUrl) {
              core.warning('Missing SLACK_WEBHOOK_URL; notification not sent.');
              return;
            }

            // Equivalent to curl --data-urlencode "payload=...".
            const body = new URLSearchParams({ payload: JSON.stringify(payload) }).toString();
            let lastErr;
            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              try {
                const resp = await fetch(webhookUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body,
                  signal: AbortSignal.timeout(15000),
                });
                const responseBody = await resp.text();
                if (!resp.ok || responseBody.trim() !== 'ok') {
                  throw new Error(`Slack webhook rejected notification (HTTP ${resp.status}).`);
                }
                core.info('Slack notification sent successfully.');
                return;
              } catch (err) {
                // Do not log errors containing the secret webhook URL.
                lastErr = new Error('Slack notification failed after retries.');
                core.warning(`Attempt ${attempt}/${MAX_RETRIES} failed.`);
                if (attempt < MAX_RETRIES) await sleep(RETRY_BACKOFF * Math.pow(2, attempt - 1));
              }
            }
            throw lastErr;
