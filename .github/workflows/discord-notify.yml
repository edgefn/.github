        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""
      actor:
        required: false
        type: string
        default: ""
      run_url:
        required: false
        type: string
        default: ""
      build_status:
        required: false
        type: string
        default: ""
      deploy_status:
        required: false
        type: string
        default: ""
      run_status:
        required: false
        type: string
        default: ""
      pr_author:
        description: "PR 作者（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR 编号（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_title:
        description: "PR 标题（merge 通知用）"
        required: false
        type: string
        default: ""
      pr_url:
        description: "PR 链接（merge 通知用）"
        required: false
        type: string
        default: ""
      base_ref:
        description: "PR 目标分支（merge 通知用）"
        required: false
        type: string
        default: ""
      head_ref:
        description: "PR 来源分支（merge 通知用）"
        required: false
        type: string
        default: ""
      # —— 已合并分支清理通知专用 inputs ——
      default_branch:
        description: "默认分支（branch_cleanup 通知用）"
        required: false
        type: string
        default: ""
      deleted_count:
        description: "已删除分支数量（branch_cleanup 通知用）"
        required: false
        type: string
        default: "0"
      deleted_branches:
        description: "已删除分支列表，可包含换行（branch_cleanup 通知用）"
        required: false
